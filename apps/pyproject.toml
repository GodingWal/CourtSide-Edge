[project]
name = "wnba-apps"
version = "0.1.0"
description = "Typer CLI and FastAPI service surfaces."
requires-python = "==3.12.*"
dependencies = ["wnba-services", "typer>=0.15", "rich>=13.9", "fastapi>=0.115", "uvicorn>=0.34"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["wnba_apps"]

[tool.uv.sources]
wnba-services = { workspace = true }

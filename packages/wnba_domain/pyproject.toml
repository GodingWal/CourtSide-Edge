[project]
name = "wnba-domain"
version = "0.1.0"
description = "Strict Pydantic ontology: the canonical WNBA and betting object model."
requires-python = "==3.12.*"
dependencies = ["pydantic>=2.10"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["wnba_domain"]

[project]
name = "wnba-store"
version = "0.1.0"
description = "Bitemporal Postgres repositories and the local DuckDB/Parquet lake."
requires-python = "==3.12.*"
dependencies = ["wnba-domain", "wnba-obs", "psycopg[binary]>=3.2", "duckdb>=1.1", "polars>=1.17"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["wnba_store"]

[tool.uv.sources]
wnba-domain = { workspace = true }
wnba-obs = { workspace = true }

[project]
name = "wnba-obs"
version = "0.1.0"
description = "Structured logging, run manifests and data lineage."
requires-python = "==3.12.*"
dependencies = ["structlog>=24.4", "pydantic>=2.10"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["wnba_obs"]

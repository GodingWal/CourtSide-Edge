[project]
name = "wnba-rules"
version = "0.1.0"
description = "Declarative, human-approved analyst rules. Codified knowledge, not executable code."
requires-python = "==3.12.*"
dependencies = ["wnba-domain", "pydantic>=2.10"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["wnba_rules"]

[tool.uv.sources]
wnba-domain = { workspace = true }

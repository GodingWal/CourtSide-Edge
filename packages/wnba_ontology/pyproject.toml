[project]
name = "wnba-ontology"
version = "0.1.0"
description = "Ontology YAML definitions, loader, and domain-drift enforcement."
requires-python = "==3.12.*"
dependencies = ["wnba-domain", "pyyaml>=6.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["wnba_ontology"]

[tool.uv.sources]
wnba-domain = { workspace = true }
wnba-obs = { workspace = true }

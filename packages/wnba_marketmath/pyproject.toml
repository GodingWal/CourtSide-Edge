[project]
name = "wnba-marketmath"
version = "0.1.0"
description = "Odds math, pickem payout tables, entry EV and fractional Kelly sizing."
requires-python = "==3.12.*"
dependencies = ["wnba-domain", "numpy>=2.1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["wnba_marketmath"]

[tool.uv.sources]
wnba-domain = { workspace = true }
wnba-obs = { workspace = true }

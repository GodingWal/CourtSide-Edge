[project]
name = "wnba-services"
version = "0.1.0"
description = "Ingestion, features, forecasting, market engine, research agents, learning loop."
requires-python = "==3.12.*"
dependencies = ["wnba-domain", "wnba-ontology", "wnba-store", "wnba-quality", "wnba-marketmath", "wnba-sim", "wnba-obs", "httpx>=0.28", "tenacity>=9.0", "polars>=1.17", "pdfplumber>=0.11"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["wnba_services"]

[project.optional-dependencies]
stats = ["sportsdataverse>=0.0.39", "pbpstats>=1.3"]
# The gradient-boosted challenger. Optional because production must never depend on it: the
# challenger is loaded only when an artifact exists, and its absence is a normal state rather
# than a broken install.
models = ["lightgbm>=4.5"]

[tool.uv.sources]
wnba-domain = { workspace = true }
wnba-ontology = { workspace = true }
wnba-store = { workspace = true }
wnba-quality = { workspace = true }
wnba-marketmath = { workspace = true }
wnba-sim = { workspace = true }
wnba-obs = { workspace = true }

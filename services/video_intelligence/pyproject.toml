[project]
name = "wnba-video"
version = "0.1.0"
description = "Isolated computer-vision sandbox. Never a production dependency."
requires-python = ">=3.12"
dependencies = ["pyyaml>=6.0", "pydantic>=2.10"]

# Heavy vision stack is opt-in. Installing torch and ultralytics must never be a prerequisite
# for running the forecasting platform or its tests.
[project.optional-dependencies]
vision = ["ultralytics>=8.3", "opencv-python>=4.10", "numpy>=2.1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wnba_video_intelligence"]

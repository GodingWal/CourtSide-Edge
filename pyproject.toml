[project]
name = "wnba-prop-intelligence"
version = "0.1.0"
description = "WNBA player-prop decision-support platform: ontology-backed, bitemporal, probabilistic, analysis-only."
readme = "README.md"
requires-python = "==3.12.*"
dependencies = [
    "wnba-domain",
    "wnba-ontology",
    "wnba-store",
    "wnba-quality",
    "wnba-marketmath",
    "wnba-sim",
    "wnba-rules",
    "wnba-obs",
    "wnba-services",
    "wnba-apps",
]

[project.scripts]
wnba = "wnba_apps.cli.main:app"

[tool.uv.workspace]
members = ["packages/*", "services", "apps"]
exclude = ["services/video_intelligence"]

[tool.uv.sources]
wnba-domain = { workspace = true }
wnba-ontology = { workspace = true }
wnba-store = { workspace = true }
wnba-quality = { workspace = true }
wnba-marketmath = { workspace = true }
wnba-sim = { workspace = true }
wnba-rules = { workspace = true }
wnba-obs = { workspace = true }
wnba-services = { workspace = true }
wnba-apps = { workspace = true }

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "hypothesis>=6.122",
    "mypy>=1.14",
    "ruff>=0.9",
    "types-pyyaml>=6.0",
    "respx>=0.22",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
bypass-selection = true

# ---------------------------------------------------------------------------
# Lint / format
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["services/video_intelligence", "research/notebooks"]

[tool.ruff.lint]
select = [
    "E", "F", "W",      # pycodestyle / pyflakes
    "I",                # isort
    "N",                # pep8-naming
    "UP",               # pyupgrade
    "B",                # bugbear
    "A",                # builtins shadowing
    "C4",               # comprehensions
    "DTZ",              # naive-datetime bans -- critical for a bitemporal system
    "T20",              # no print()
    "SIM",              # simplify
    "PTH",              # pathlib
    "RUF",
]
ignore = ["N818"]

[tool.ruff.lint.per-file-ignores]
# Printing is the entire job of the task runner and the CLI.
"tests/**" = ["T20"]
"apps/wnba_apps/cli/**" = ["T20"]
"tasks.py" = ["T20"]

# ---------------------------------------------------------------------------
# Types
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
# The video sandbox lives outside the workspace but is still type-checked.
mypy_path = "services/video_intelligence/src"
strict = true
warn_unreachable = true
disallow_any_generics = true
plugins = ["pydantic.mypy"]
exclude = ["services/video_intelligence", "research/"]

[[tool.mypy.overrides]]
module = ["duckdb.*", "polars.*", "sportsdataverse.*", "pbpstats.*", "supabase.*"]
ignore_missing_imports = true

# ---------------------------------------------------------------------------
# Tests
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers --strict-config"
markers = [
    "network: hits a live external source (deselect with -m 'not network')",
    "slow: long-running simulation or backtest",
]
filterwarnings = ["error::DeprecationWarning"]
